# The macOS builds, one on each kind of Mac: Apple silicon (arm64) and Intel (x86_64).
# For now they build the cores only (out/frond and out/frond-68k).
name: macOS

on:
  workflow_dispatch:
  push:
    branches: [ci/desktop-ports]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install sdl2 sdl2_image libslirp boost ninja cmake pkg-config readline make

      - name: Build the cores
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix readline)/lib/pkgconfig:$PKG_CONFIG_PATH"
          set -o pipefail
          gmake -k -j"$(sysctl -n hw.ncpu)" BUILD_JOBS="$(sysctl -n hw.ncpu)" out/frond out/frond-68k 2>&1 | tee build.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-log-macos-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore
