# The macOS builds, one on each kind of Mac: Apple silicon (arm64) and Intel (x86_64).
# They build the cores and the desktop, make Frond.app and a dmg, and start the built app.
name: macOS

on:
  workflow_dispatch:
  push:
    branches: [ci/desktop-ports]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install sdl2 sdl2_image libslirp boost ninja cmake pkg-config readline make qt librsvg

      - name: Build the cores
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix readline)/lib/pkgconfig:$PKG_CONFIG_PATH"
          set -o pipefail
          gmake -k -j"$(sysctl -n hw.ncpu)" BUILD_JOBS="$(sysctl -n hw.ncpu)" out/frond out/frond-68k 2>&1 | tee build.log

      - name: Build the desktop
        run: |
          set -o pipefail
          cmake -S desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFROND_PREPARED_SOURCE="$PWD/core" -DCMAKE_PREFIX_PATH="$(brew --prefix)" 2>&1 | tee -a build.log
          cmake --build build/desktop --target frond-desktop 2>&1 | tee -a build.log

      - name: Make the app and the dmg
        run: |
          set -o pipefail
          export PATH="$(brew --prefix qt)/bin:$PATH"
          sh packaging/macos/make-app.sh 2>&1 | tee -a build.log

      - name: Start the built app
        run: |
          set -o pipefail
          APP=out/Frond.app/Contents/MacOS
          QT_QPA_PLATFORM=offscreen "$APP/Frond" --version
          "$APP/frond-68k" --version
          # The ARM core has no version flag; it must start and print its usage, not fail to load.
          set +e
          "$APP/frond" > core.out 2>&1 < /dev/null
          code=$?
          cat core.out
          if [ "$code" -ge 126 ]; then echo "core exited with $code"; exit 1; fi
          # A short run of the desktop: it must stay up for a few seconds.
          QT_QPA_PLATFORM=offscreen "$APP/Frond" &
          pid=$!
          sleep 5
          kill -0 "$pid" || { echo "desktop exited early"; exit 1; }
          kill "$pid"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frond-macos-${{ matrix.arch }}
          path: out/Frond-*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-log-macos-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore
