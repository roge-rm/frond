# The Windows build in MSYS2 UCRT64 (gcc). For now it builds the cores only
# (out/frond.exe and out/frond-68k.exe).
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [ci/desktop-ports]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            python
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            SDL2:p
            SDL2_image:p
            libslirp:p
            boost:p
            zlib:p

      - name: Build the cores
        run: |
          set -o pipefail
          make -k -j4 BUILD_JOBS=4 out/frond out/frond-68k 2>&1 | tee build.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: build-log-windows
          path: build.log
          if-no-files-found: ignore
